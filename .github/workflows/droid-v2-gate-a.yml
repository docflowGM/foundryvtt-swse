name: Droid V2 Gate A (targeted)

on:
  pull_request:
    paths:
      - 'scripts/domain/droids/**'
      - 'scripts/data/droid-part-schema.js'
      - 'scripts/engine/customization/droid-customization-engine.js'
      - 'scripts/apps/progression-framework/steps/droid-builder*.js'
      - 'tests/droid-*.test.mjs'
      - 'tools/check-droid-*.mjs'
      - 'tools/lib/droid-explicit-action-sites.mjs'
      - 'scripts/engine/upgrades/UpgradeService.js'
      - 'scripts/apps/follower-creator.js'
      - 'scripts/apps/progression-framework/adapters/default-subtypes.js'
      - 'scripts/data/generated-droid-component-source-status.js'
      - 'scripts/sheets/v2/droid-actor-sheet.js'
      - 'scripts/sheets/v2/character-like-sheet.js'
      - 'scripts/sheets/v2/droid-sheet/**'
      - '.github/workflows/droid-v2-gate-a.yml'
  push:
    branches:
      - feature/droid-v2-component-quote-gate-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pure quote and live consumer checks
        run: |
          set -e
          node tests/droid-component-quote-authority.test.mjs
          node tests/droid-part-source-quote-adapter.test.mjs
          node tests/droid-builder-v2-quote-integration.test.mjs
          node tests/droid-source-review-gate.test.mjs
          node tests/droid-component-prerequisites.test.mjs
          node tests/droid-hardened-source-modifier-consumption.test.mjs
          node tests/droid-sgd-host002-arithmetic.test.mjs
          node tools/build-droid-component-source-status.mjs --check
          node tools/audit-droid-source-field-ownership.mjs
      - name: Existing Garage and ownership checks
        run: |
          set -e
          node tests/droid-customization-exploit.test.mjs
          node tests/customization-bay-foundation-contract.test.mjs
      - name: Droid strict authority guards (enforced, --strict)
        run: |
          set -e
          node tools/check-droid-authority-ssot.mjs --strict
          node tools/check-droid-calculation-mode-authority.mjs --strict
          node tools/check-droid-reconciliation-authority.mjs --strict
          node tools/check-droid-installation-write-authority.mjs --strict
          node tools/check-droid-customization-validation-authority.mjs --strict
          node tests/droid-strict-authority-guards.test.mjs
      - name: Droid Gate C-1 appendage identity
        run: |
          set -e
          node tests/droid-appendage-instance-identity.test.mjs
          node tests/droid-gate-c1-appendage-instances.test.mjs
          node tests/droid-gate-c1-sheet-rows.test.mjs
          node tests/droid-gate-c1-workshop-removal.test.mjs
      - name: Droid Gate C-2 installation eligibility
        run: |
          set -e
          node tests/droid-wave2b-installation-eligibility.test.mjs
      - name: Droid Gate C-3A initial installation seeding
        run: |
          set -e
          node tests/droid-gate-c3a-initial-installation.test.mjs
          node tests/droid-garage-resale-evidence.test.mjs
          node tests/droid-rules-profile.test.mjs
          node tests/droid-prerequisite-evidence.test.mjs
          node tests/follower-mutation-transaction.test.mjs
