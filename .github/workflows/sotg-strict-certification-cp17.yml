name: SotG CP17-CP22 Publication Evidence, Adjudication and Source Reference Gates

on:
  push:
    branches:
      - audit/sotg-strict-certification-cp17
    paths:
      - data/audits/vehicles/swse-phase2b-sotg-cp17-*.json
      - tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-17-independent-baseline.md
      - data/audits/vehicles/swse-phase2c-cp18-*.json
      - data/audits/vehicles/swse-phase2c-sotg-cp18-*.json
      - tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-18-*.md
      - data/audits/vehicles/swse-phase2b-sotg-cp19-tranche*.json
      - tools/audits/vehicles/check_sotg_phase2b_cp19_tranche*.py
      - tools/audits/vehicles/check_sotg_phase2b_cp19_tranche*.mjs
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-19-*.md
      - data/audits/vehicles/swse-sotg-cp20-*.json
      - data/audits/vehicles/swse-sotg-cp21-*.json
      - tools/audits/vehicles/check_sotg_cp21_*.py
      - tools/audits/vehicles/sotg_cp21_*.py
      - docs/audits/vehicles/swse-sotg-cp21-*.md
      - scripts/domain/vehicles/vehicle-cp22-source-catalog.generated.js
      - scripts/domain/vehicles/vehicle-cp22-source-view.js
      - scripts/domain/vehicles/vehicle-evidence-authority.js
      - scripts/apps/vehicle-import-wizard.js
      - templates/apps/vehicle-import-wizard.hbs
      - tests/phase2c_cp22_source_view_readonly.test.mjs
      - tools/audits/vehicles/compile_sotg_cp22_reference.mjs
      - docs/audits/vehicles/swse-sotg-cp22-*.md
      - data/audits/vehicles/swse-sotg-cp23-*.json
      - tools/audits/vehicles/build_sotg_cp23_*.mjs
      - scripts/domain/vehicles/vehicle-cp23-*.js
      - tests/phase2c_cp23_*.test.mjs
      - docs/audits/vehicles/swse-sotg-cp23-*.md
      - tools/audits/vehicles/check_sotg_cp20_source_fidelity.py
      - docs/audits/vehicles/swse-sotg-cp20-*.md
      - tools/audits/vehicles/check_sotg_cp20_tranche*.py
      - .github/workflows/sotg-strict-certification-cp17.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp17-evidence-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
      - name: Verify Python syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py
      - name: Report unavailable CP16 historical continuity input
        run: |
          if [ ! -f data/audits/vehicles/swse-phase2b-sotg-cp15-per-entry-certification-ledger.json ]; then
            echo "::warning::CP16 historical continuity test BLOCKED: CP15 comparison ledger is not committed on this inherited audit branch."
            echo "CP16_CONTINUITY=NOT_EXECUTED_MISSING_CP15" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate CP16 historical continuity when its prerequisite is available
        if: ${{ hashFiles('data/audits/vehicles/swse-phase2b-sotg-cp15-per-entry-certification-ledger.json') != '' }}
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp16_certifications.py --repo "."
      - name: Validate CP17 independent baseline and work queue
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py --repo "."
      - name: Install JSON Schema validator (pinned)
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Verify CP18 verifier syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py
      - name: Validate CP18 policy evidence losslessness and schema pressure
        run: python3 tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py --repo "."
      - name: Verify CP19 tranche 01 validator syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2b_cp19_tranche01.py
      - name: Validate CP19 tranche 01 reviewed source evidence and certification boundaries
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp19_tranche01.py --repo "."

      - name: Validate CP19 tranche 02 source review, provenance and non-certification
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche02.mjs

      - name: Verify CP19 tranche 03 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche03.mjs
      - name: Validate CP19 tranche 03 source observations and unapplied corrections
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche03.mjs

      - name: Verify CP19 tranche 04 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche04.mjs
      - name: Validate CP19 tranche 04 reviewed source evidence and no-runtime-authority
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche04.mjs

      - name: Verify CP19 tranche 05 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche05.mjs
      - name: Validate CP19 tranche 05 published facts and non-certification
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche05.mjs

      - name: Verify CP19 final 25 source closeout validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_closeout.mjs
      - name: Validate all seven CP19 tranches and 100-ship closeout
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_closeout.mjs

      - name: Verify CP20 source-fidelity certificate validator syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_source_fidelity.py
      - name: Validate CP20 source fidelity, accepted audit-only corrections and zero runtime authority
        run: python3 tools/audits/vehicles/check_sotg_cp20_source_fidelity.py --repo "."

      - name: Compile CP20 tranche 02 independent source-fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche02.py
      - name: Verify CP20 tranche 02 publication certificates and strict runtime boundaries
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche02.py --repo "."

      - name: Compile CP20 tranche 03 independent source-fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche03.py
      - name: Verify CP20 tranche 03 publication certificates and strict runtime boundaries
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche03.py --repo "."

      - name: Compile CP20 tranche 04 independent source-fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche04.py
      - name: Verify CP20 tranche 04 publication certificates and strict runtime boundaries
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche04.py --repo "."

      - name: Compile CP20 tranche 05 independent source-fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche05.py
      - name: Verify CP20 tranche 05 source provenance and zero runtime authority
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche05.py --repo "."

      - name: Compile CP20 tranche 06 source-fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche06.py
      - name: Validate CP20 tranche 06 ten publication certificates
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche06.py --repo "."

      - name: Compile CP20 tranche 07 conflict-priority fidelity validator
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_cp20_tranche07.py
      - name: Verify CP20 final 100 source-fidelity identities and no runtime grant
        run: python3 tools/audits/vehicles/check_sotg_cp20_tranche07.py --repo "."

      - name: Compile CP21 approved effective adjudication projector and validator
        run: python3 -m py_compile tools/audits/vehicles/sotg_cp21_effective_projection.py tools/audits/vehicles/check_sotg_cp21_approved_adjudications.py
      - name: Validate CP21 owner-approved 15 exception decisions without production authority
        run: python3 tools/audits/vehicles/check_sotg_cp21_approved_adjudications.py --repo "."

      - name: Validate CP22 generated source view compiler and source provenance parity
        run: node tools/audits/vehicles/compile_sotg_cp22_reference.mjs --check
      - name: Verify CP22 source view, warnings and stock combat refusal
        run: node --test tests/phase2c_cp22_source_view_readonly.test.mjs
      - name: Verify CP9A and CP9C vehicle import and stock provenance regression
        run: node --test tests/phase2c_cp9a_vehicle_import_boundaries.test.mjs tests/phase2c_cp9c_actor_provenance_probe.test.mjs

      - name: Verify CP23 reconciliation builder and immutable legacy pack input
        run: node tools/audits/vehicles/build_sotg_cp23_reconciliation.mjs --check
      - name: Validate CP23 15-source legacy pack comparison and native pack diagnostic
        run: node --test tests/phase2c_cp23_pack_reconciliation.test.mjs
