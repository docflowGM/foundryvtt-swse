name: SotG CP17-CP19 Source Certification Evidence Gates

on:
  push:
    branches:
      - audit/sotg-strict-certification-cp17
    paths:
      - data/audits/vehicles/swse-phase2b-sotg-cp17-*.json
      - tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-17-independent-baseline.md
      - data/audits/vehicles/swse-phase2c-cp18-*.json
      - data/audits/vehicles/swse-phase2c-sotg-cp18-*.json
      - tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-18-*.md
      - data/audits/vehicles/swse-phase2b-sotg-cp19-tranche*.json
      - tools/audits/vehicles/check_sotg_phase2b_cp19_tranche*.py
      - tools/audits/vehicles/check_sotg_phase2b_cp19_tranche*.mjs
      - docs/audits/vehicles/swse-phase2-sotg-checkpoint-19-*.md
      - .github/workflows/sotg-strict-certification-cp17.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp17-evidence-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
      - name: Verify Python syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py
      - name: Report unavailable CP16 historical continuity input
        run: |
          if [ ! -f data/audits/vehicles/swse-phase2b-sotg-cp15-per-entry-certification-ledger.json ]; then
            echo "::warning::CP16 historical continuity test BLOCKED: CP15 comparison ledger is not committed on this inherited audit branch."
            echo "CP16_CONTINUITY=NOT_EXECUTED_MISSING_CP15" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate CP16 historical continuity when its prerequisite is available
        if: ${{ hashFiles('data/audits/vehicles/swse-phase2b-sotg-cp15-per-entry-certification-ledger.json') != '' }}
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp16_certifications.py --repo "."
      - name: Validate CP17 independent baseline and work queue
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp17_baseline.py --repo "."
      - name: Install JSON Schema validator (pinned)
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Verify CP18 verifier syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py
      - name: Validate CP18 policy evidence losslessness and schema pressure
        run: python3 tools/audits/vehicles/check_sotg_phase2c_cp18_evidence_policy.py --repo "."
      - name: Verify CP19 tranche 01 validator syntax
        run: python3 -m py_compile tools/audits/vehicles/check_sotg_phase2b_cp19_tranche01.py
      - name: Validate CP19 tranche 01 reviewed source evidence and certification boundaries
        run: python3 tools/audits/vehicles/check_sotg_phase2b_cp19_tranche01.py --repo "."

      - name: Validate CP19 tranche 02 source review, provenance and non-certification
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche02.mjs

      - name: Verify CP19 tranche 03 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche03.mjs
      - name: Validate CP19 tranche 03 source observations and unapplied corrections
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche03.mjs

      - name: Verify CP19 tranche 04 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche04.mjs
      - name: Validate CP19 tranche 04 reviewed source evidence and no-runtime-authority
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche04.mjs

      - name: Verify CP19 tranche 05 validator syntax
        run: node --check tools/audits/vehicles/check_sotg_phase2b_cp19_tranche05.mjs
      - name: Validate CP19 tranche 05 published facts and non-certification
        run: node tools/audits/vehicles/check_sotg_phase2b_cp19_tranche05.mjs
