name: Universal Vehicles Phase 4A-4D Runtime and Native Pack QA
on:
  pull_request:
    paths:
      - 'scripts/domain/vehicles/**'
      - 'scripts/engine/import/vehicle-import-engine.js'
      - 'scripts/core/vehicle-pack-data-loader.js'
      - 'tools/build-universal-vehicle-*.mjs'
      - 'tools/release/**'
      - 'data/canonical/vehicles/**'
      - 'tests/vehicle-universal-*.test.mjs'
      - 'tests/phase2c_cp23c4c_import_boundary.test.mjs'
      - 'system.json'
      - 'index.js'
      - '.github/workflows/vehicle-universal-phase1.yml'
  push:
    branches:
      - audit/universal-vehicles-phase1
    paths:
      - 'data/audits/vehicles/swse-universal-*.json'
      - 'docs/audits/vehicles/universal-vehicle-phase-roadmap.md'
      - 'tests/vehicle-universal-*.test.mjs'
      - 'tools/build-universal-vehicle-canonical.mjs'
      - 'tools/build-universal-vehicle-pack-sources.mjs'
      - 'tools/build-universal-vehicle-native-packs.mjs'
      - 'tools/release/**'
      - 'system.json'
      - 'index.js'
      - 'scripts/domain/vehicles/vehicle-phase4d-runtime-audit.js'
      - 'scripts/domain/vehicles/vehicle-phase4d-scratch-import.js'
      - 'scripts/domain/vehicles/vehicle-compendium-index.js'
      - 'tests/phase2c_cp23c4c_import_boundary.test.mjs'
      - 'scripts/core/vehicle-pack-data-loader.js'
      - 'scripts/domain/vehicles/universal-vehicle-pack-registry.js'
      - 'scripts/engine/store/**'
      - 'scripts/apps/store/store-shared.js'
      - 'scripts/apps/vehicle-import-wizard.js'
      - 'scripts/engine/import/vehicle-import-engine.js'
      - 'scripts/data/vehicle-category-registry.js'
      - 'scripts/sheets/v2/vehicle-sheet/vehicle-context-builder.js'
      - 'templates/actors/vehicle/v2/partials/vehicle-sheet-content.hbs'
      - 'templates/apps/vehicle-import-wizard.hbs'
      - 'tools/build-universal-vehicle-phase3-source-preview.mjs'
      - 'tools/lib/universal-vehicle-source-provenance.mjs'
      - 'data/canonical/vehicles/vehicles.json'
      - 'data/canonical/vehicles/vehicles.manifest.json'
      - '.github/workflows/vehicle-universal-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication identity and provenance
        run: |
          node tools/build-universal-vehicle-phase3-source-preview.mjs --check
          node tools/build-universal-vehicle-canonical.mjs --check
          node --test tests/vehicle-universal-phase*.test.mjs
          node --test tests/phase2c_cp23c4c_import_boundary.test.mjs
  native-vehicle-packs:
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - name: Install pinned Foundry V13 native pack compiler
        run: npm ci --prefix tools/release
      - name: Build and independently read back all 429 native Actors
        run: node tools/build-universal-vehicle-native-packs.mjs --out build/vehicle-phase4b/native
      - name: Verify release builder reads canonical vehicle source, not legacy pack
        run: node tools/release/build-packs.mjs --out build/vehicle-phase4c/release --only vehicles-hybrids
      - name: Archive verified native vehicle compendiums
        uses: actions/upload-artifact@v4
        with:
          name: swse-universal-vehicles-phase4b-native
          path: build/vehicle-phase4b/native/
          if-no-files-found: error
          retention-days: 14
